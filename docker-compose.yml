services:
  postgres:
    image: postgres:16-alpine
    container_name: lwc-postgres
    environment:
      POSTGRES_USER: lwc
      POSTGRES_PASSWORD: lwc
      POSTGRES_DB: lwc
    ports:
      - "5433:5432"
    volumes:
      - lwc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lwc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lwc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: lwc-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI: http://localhost:8025

volumes:
  lwc_pgdata:
