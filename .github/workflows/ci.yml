name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck • Lint • Test • Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lwc
          POSTGRES_PASSWORD: lwc
          POSTGRES_DB: lwc
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U lwc"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://lwc:lwc@localhost:5432/lwc
      PAYLOAD_SECRET: ci-secret-at-least-32-characters-long-please
      SITE_URL: http://localhost:3000
      IP_HASH_SALT: ci-salt-please-rotate-in-prod
      EMAIL_FROM: lionswrestling@dmcschools.org
      EMAIL_REPLY_TO: lionswrestling@dmcschools.org
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm build
